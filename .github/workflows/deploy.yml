name: CI/CD — DeliveryBot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & Validate ──────────────────────────────────────────────
  lint:
    name: Lint Python Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sim/requirements.txt

      - name: Install dependencies + ruff
        run: |
          pip install -r sim/requirements.txt
          pip install ruff

      - name: Ruff lint check
        run: ruff check sim/ --ignore E501,E402

  # ── 2. Build Docker Image → ghcr.io ────────────────────────────────
  docker:
    name: Docker Build → ghcr.io
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./sim
          dockerfile: ./sim/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy Backend → Render ─────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        # Add RENDER_DEPLOY_HOOK in repo Settings → Secrets → Actions
        # Get it from Render dashboard → your service → Settings → Deploy Hook
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"

  # ── 4. Deploy Frontend → GitHub Pages ──────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → GitHub Pages
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect frontend files
        run: |
          mkdir -p /tmp/gh-pages
          # Copy all HTML / JS / CSS — exclude backend and config
          cp *.html *.js *.css /tmp/gh-pages/ 2>/dev/null || true
          touch /tmp/gh-pages/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gh-pages
          publish_branch: gh-pages
          commit_message: "ci: deploy frontend ${{ github.sha }}"
